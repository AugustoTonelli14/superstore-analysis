[project]
name = "superstore-analysis"
version = "1.0.0"
description = "End-to-end data engineering & BI analysis of retail profitability"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # module-level imports — needed for sys.path manipulation in pipeline.py and notebooks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
