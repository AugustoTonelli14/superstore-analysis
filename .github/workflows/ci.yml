name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --config pyproject.toml

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  pipeline-smoke:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Python pipeline
        run: python pipeline.py
      - name: Verify mart outputs exist
        run: |
          test -f data/marts/sales_performance_mart.csv
          test -f data/marts/profitability_mart.csv
          test -f data/marts/customer_segment_mart.csv
          test -f data/marts/regional_performance_mart.csv
          test -f data/marts/discount_impact_mart.csv
      - name: Run SQL pipeline
        run: python sql/run_sql_pipeline.py
